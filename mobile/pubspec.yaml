name: familyboard_mobile
description: FamilyBoard mobile companion app (M2.1 skeleton — pairing + home stub).
publish_to: "none"
version: 0.1.19

environment:
  # Floor raised by this dependency refresh: flutter_riverpod 3.x needs
  # Dart ^3.12.0; go_router 17.x needs Flutter >=3.38.0 (both satisfied by
  # our dev toolchain, Flutter 3.44.5 / Dart 3.12.2).
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  go_router: ^17.0.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  mobile_scanner: ^7.0.0
  nsd: ^5.0.0
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.0.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

# App icons are generated by the repo-root script `scripts/generate-app-icons.mjs`
# directly from inline SVG via `sharp`. To re-generate after a rebrand:
#   node scripts/generate-app-icons.mjs   # from the repo root
# The script writes Android mipmaps + adaptive foregrounds in place.
# iOS icons require the Runner/Assets.xcassets — see the script's docstring.
